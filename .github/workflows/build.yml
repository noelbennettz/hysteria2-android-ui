name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Gradle build failed (exit $rc); surfacing compiler errors:"
            grep -E '^e: |error:|What went wrong|Caused by|> Task .* FAILED' /tmp/build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hy2droid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

