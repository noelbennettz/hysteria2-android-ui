# Gradle daemon JVM. Lint and R8 both need room; 2 GB is enough for a single module.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
# Each library's R class carries only its own resources, which keeps the app's
# R class small without any call-site change.
android.nonTransitiveRClass=true

kotlin.code.style=official
