plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

// Version of the bundled Hysteria core, recorded by scripts/core.sh in
// core/core.properties. Regenerate that file with `scripts/core.sh upgrade`.
def corePropsFile = rootProject.file('core/core.properties')
def coreProps = new Properties()
if (corePropsFile.exists()) {
    corePropsFile.withInputStream { coreProps.load(it) }
}
def coreVersion = coreProps.getProperty('HYSTERIA_VERSION', 'unknown')

// Release builds override these from CI (-P flags or env); defaults keep local
// debug builds working.
def appVersionName = (project.findProperty('versionName')
        ?: System.getenv('HY2_VERSION_NAME')
        ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('versionCode')
        ?: System.getenv('HY2_VERSION_CODE')
        ?: '1').toString().toInteger()

// Keystore location: CI restores the signing key to signing/production.jks
// (gitignored), an explicit path can be given through HY2_KEYSTORE_FILE.
def keystoreFile = file(System.getenv('HY2_KEYSTORE_FILE')
        ?: rootProject.file('signing/production.jks').absolutePath)

android {
    namespace 'us.leaf3stones.hy2droid'
    compileSdk 34

    defaultConfig {
        applicationId "us.leaf3stones.hy2droid"
        minSdk 30
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        // Exposed at runtime as BuildConfig.CORE_VERSION (see scripts/core.sh).
        buildConfigField "String", "CORE_VERSION", "\"${coreVersion}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    signingConfigs {
        release {
            // SECURITY: keystore + passwords are NEVER committed to version control.
            // Provide them locally via gradle properties (e.g. ~/.gradle/gradle.properties
            // or -P flags) or environment variables before building a release.
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword(System.getenv("HY2_KEYSTORE_PASSWORD") ?: project.findProperty("HY2_KEYSTORE_PASSWORD"))
                keyAlias(System.getenv("HY2_KEY_ALIAS") ?: project.findProperty("HY2_KEY_ALIAS") ?: "signing")
                keyPassword(System.getenv("HY2_KEY_PASSWORD") ?: project.findProperty("HY2_KEY_PASSWORD"))
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // CI runs `lintDebug`: lint errors fail the build, warnings stay warnings.
    // Translation coverage is checked by the i18n script instead (it compares the
    // key sets across all locales, which lint cannot do).
    lint {
        abortOnError = true
        warningsAsErrors = false
        disable 'MissingTranslation'
    }
}

// The Hysteria core binaries are downloaded at build time instead of being
// committed (see scripts/core.sh + core/core.properties). This task is a no-op
// when the pinned binaries are already present and match their checksums.
tasks.register('fetchCore', Exec) {
    group = 'build setup'
    description = 'Download the pinned Hysteria core into app/src/main/jniLibs'
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/core.sh').absolutePath, 'fetch'
}

tasks.named('preBuild').configure { dependsOn 'fetchCore' }

dependencies {
    implementation libs.androidx.datastore.preferences

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation(libs.androidx.lifecycle.viewmodel.compose)

    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.extended
    implementation libs.zxing.core
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}